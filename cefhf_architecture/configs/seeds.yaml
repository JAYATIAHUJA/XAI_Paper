# CEFHF seeds and configuration
# Single source of truth for reproducibility. All scripts read these.

seeds:
  global: 42            # master seed
  cv: 42                # StratifiedKFold shuffle
  bootstrap: 2024       # bootstrap CIs for fairness metrics
  tune: 42              # RandomizedSearchCV
  synthetic: 7          # synthetic SCM generation
  model_init: 42        # classifier random_state

cv_folds: 5
bootstrap_iters: 200

# Protected attribute and target by dataset
datasets:
  synthetic:
    sensitive: "gender"          # A (primary protected)
    secondary_sensitive: "race" # used for the race->ZIP->university proxy path
    target: "shortlisted"
  adult:
    sensitive: "sex"
    target: "income"
  recruitment:
    sensitive: "gender"
    target: "shortlisted"

# CFVR thresholds (paper uses tau = 0.10)
cfvr:
  tau_prob: 0.10
  tau_sweep: [0.05, 0.10, 0.15, 0.20, 0.25]

# Layer 4 lambda sweep (replaces Proposition 2 with the Pareto plot / H2)
lambda_sweep: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]

# Layer 2 / 21 gamma sensitivity sweep (replaces Proposition 1 with H1)
gamma_sweep: [1.0, 1.2, 1.5, 2.0]

# Layer 1 proxy detection thresholds
proxy:
  auc_flag: 0.60
  mi_flag: 0.02

# Layer 6 router thresholds
router:
  tau_ps_sweep: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  df_eps_breach: 0.10
